name: immich
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.1.0
    container_name: immich_server
    restart: unless-stopped
    depends_on:
      - redis
      - database
    ports:
      - "2283:2283"
    volumes:
      - /DATA/AppData/immich/upload:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0
    container_name: immich_machine_learning
    restart: unless-stopped
    volumes:
      - /DATA/AppData/immich/model-cache:/cache

  redis:
    image: redis:6.2-alpine
    container_name: immich_redis
    restart: unless-stopped

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich_postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - /DATA/AppData/immich/postgres:/var/lib/postgresql/data

x-glass:
  title:
    pt_br: Immich
    en_us: Immich
  tagline:
    pt_br: Backup e gerenciamento self-hosted de fotos e vídeos.
    en_us: Self-hosted photo and video backup and management.
  description:
    pt_br: |
      Plataforma self-hosted de gerenciamento, backup e visualização de
      fotos e vídeos.
    en_us: |
      Self-hosted platform for managing, backing up and browsing your
      photos and videos.
  developer: Immich
  category: multimedia
  tags: [photos, videos, backup, gallery, ai]
  architectures: [amd64, arm64]
  version: "3.1.0"
  updatedAt: "2026-08-25"
  icon: ./assets/icon.svg
  background: ./assets/background.png
  screenshots:
    - ./assets/screenshot-1.png
  website: https://immich.app/
  source: https://github.com/immich-app/immich
  docs: https://docs.immich.app/
  entrypoint:
    main: immich-server
    index: /
    portMap: "2283"
    scheme: http
  customInstall: true
  requirements:
    memory:
      minimum: 2GB
      recommended: 6GB+
    storage:
      minimum: 10GB
      recommended: 500GB+
    processor:
      minimum: Quad Core
      recommended: Eight Core
