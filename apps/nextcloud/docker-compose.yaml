name: nextcloud
services:
  nextcloud:
    image: nextcloud:34.0.2
    container_name: nextcloud
    restart: unless-stopped
    depends_on:
      - database
      - redis
    ports:
      - "8080:80"
    volumes:
      - /DATA/AppData/nextcloud/html:/var/www/html
    environment:
      MYSQL_HOST: database
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloud
      REDIS_HOST: redis

  database:
    image: mariadb:11.4
    container_name: nextcloud_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: nextcloud
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloud
    volumes:
      - /DATA/AppData/nextcloud/db:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    container_name: nextcloud_redis
    restart: unless-stopped

x-glass:
  title:
    pt_br: Nextcloud
    en_us: Nextcloud
  tagline:
    pt_br: Sua própria nuvem para arquivos, colaboração e produtividade.
    en_us: Your own cloud for files, collaboration and productivity.
  description:
    pt_br: |
      Plataforma self-hosted para armazenamento de arquivos, sincronização
      e colaboração.
    en_us: |
      Self-hosted platform for file storage, sync and collaboration.
  developer: Nextcloud GmbH
  category: productivity
  tags: [cloud, files, sync, collaboration, calendar]
  architectures: [amd64, arm64]
  version: "34.0.2"
  updatedAt: "2026-08-25"
  icon: ./assets/icon.png
  background: ./assets/background.png
  screenshots:
    - ./assets/screenshot-1.png
    - ./assets/screenshot-2.png
    - ./assets/screenshot-3.png
  website: https://nextcloud.com/
  source: https://github.com/nextcloud/server
  docs: https://docs.nextcloud.com/
  entrypoint:
    main: nextcloud
    index: /
    portMap: "8080"
    scheme: http
  customInstall: true
  requirements:
    memory:
      minimum: 1GB
      recommended: 4GB+
    storage:
      minimum: 10GB
      recommended: 50GB+
    processor:
      minimum: Dual Core
      recommended: Quad Core
