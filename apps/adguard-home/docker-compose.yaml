name: adguard-home
services:
  adguard-home:
    image: adguard/adguardhome:v0.107.70
    container_name: adguard-home
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3080:3000/tcp"
      - "8081:80/tcp"
    volumes:
      - /DATA/AppData/adguard-home/work:/opt/adguardhome/work
      - /DATA/AppData/adguard-home/conf:/opt/adguardhome/conf

x-glass:
  title: AdGuard Home
  tagline: Network-wide ads and trackers blocking.
  description: Self-hosted DNS server that blocks ads, trackers and unwanted domains for your whole network.
  developer: AdGuard Software Ltd.
  category: networking
  tags: [dns, adblock, privacy, network, security]
  architectures: [amd64, arm64]
  version: "0.107.70"
  updatedAt: "2026-08-25"
  icon: ./assets/icon.webp
  background: ./assets/background.png
  screenshots:
    - ./assets/screenshot-1.png
    - ./assets/screenshot-2.webp
  website: https://adguard.com/adguard-home/overview.html
  source: https://github.com/AdguardTeam/AdGuardHome
  docs: https://github.com/AdguardTeam/AdGuardHome/wiki
  entrypoint:
    main: adguard-home
    index: /
    portMap: "3080"
    scheme: http
  customInstall: true
  requirements:
    memory:
      minimum: 256MB
      recommended: 512MB+
    storage:
      minimum: 1GB
      recommended: 5GB+
    processor:
      minimum: Single Core
      recommended: Dual Core
